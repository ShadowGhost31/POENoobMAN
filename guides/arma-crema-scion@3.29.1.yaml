# Arma Crema Scion — левелінг за гайдом Maxroll (патч 3.29).
# Тексти кроків — короткий власний переказ; деталі дивіться в оригіналі (source).
#
# Формат:
#   when: умова появи кроку  { level: N, points: N, area: "<ID зони>", step: "<id>" }
#   done: умова автоматичної відмітки (без неї крок відмічається вручну, F10)
#   if:   фільтр за опціями  { movement: shield_charge }
#   points: очки дерева за квест
# ID зон — з рядків "Generating level N area ..." у Client.txt (1_1_town — Lioneye's Watch, A1).

id: arma-crema-scion
version: "3.29.1"
title: Arma Crema Scion
patch: "3.29"
source: https://maxroll.gg/poe/build-guides/arma-crema-scion-leveling-build-guide

options:
  - id: mule
    label: Мул-Відьма на старті
    default: "yes"
    choices:
      - { id: "yes", label: З мулом }
      - { id: "no", label: Без мула }
  - id: movement
    label: Пересування
    default: shield_charge
    choices:
      - { id: shield_charge, label: Shield Charge }
      - { id: leap_slam, label: Leap Slam }
  - id: act6_path
    label: Шлях (вибір в Act 6)
    default: inversion
    choices:
      - { id: inversion, label: Sniper's Mark + Inversion }
      - { id: res_reduction, label: Monster Resistance Reduction }

timerStart: { area: "1_1_1" }

steps:
  # ---------- Мул ----------
  - id: mule_create
    act: 1
    if: { mule: "yes" }
    text: "Мул: створіть Відьму, вбийте Hillock"
    done: { area: "1_1_town" }
  - id: mule_tarkleigh_sc
    act: 1
    if: { mule: "yes", movement: shield_charge }
    text: "Мул: Rolling Magma у Tarkleigh; шукайте BBB, BBG/BGR, щит GR/GGR"
    regex: "b-b-|-b-b|b-.-b|b-b|nne|r-.-b|b-r-|g-b-r|g-r|r-g|buckler"
  - id: mule_tarkleigh_ls
    act: 1
    if: { mule: "yes", movement: leap_slam }
    text: "Мул: Rolling Magma у Tarkleigh; шукайте BBB, BBG/BGR, сокиру/меч GR/GGR"
    regex: "b-b-|-b-b|b-.-b|b-b|nne|r-.-b|b-r-|g-b-r|g-r|r-g"
  - id: mule_nessa
    act: 1
    if: { mule: "yes" }
    optional: true
    text: "(опц.) Мул у Nessa: Coral Ring за 3 Wisdom, Driftwood Wand, 1–2 Goat's Horn"
  - id: mule_stash
    act: 1
    if: { mule: "yes" }
    text: "Мул: у сховище — вейд, Rolling Magma, Arcane Surge, 2 Life + Mana фласки, покупки"

  # ---------- Act 1 ----------
  - id: a1_start
    act: 1
    text: "Скіон: Twilight Strand, вбийте Hillock, увійдіть у Lioneye's Watch"
    done: { area: "1_1_town" }
  - id: a1_l2
    act: 1
    when: { level: 2 }
    text: "Рів. 2: Rolling Magma + Arcane Surge; Rusted Sword → 2× Driftwood Wand (не крафтити)"
  - id: a1_hailrake
    act: 1
    when: { area: "1_1_2a" }
    text: "Tidal Island: вбийте Hailrake"
  - id: a1_l4
    act: 1
    when: { level: 4 }
    text: "Рів. 4: Rolling Magma + Ele Prolif · Sniper's Mark · Flame Wall · Frostblink + Arcane Surge"
  - id: a1_l4_sc
    act: 1
    when: { level: 4 }
    if: { movement: shield_charge }
    text: "(опц.) Shield Charge + Momentum; купіть щит GR/GGR і 2× Goat's Horn"
    regex: "b-b-|-b-b|b-.-b|b-b|nne|r-.-b|b-r-|g-b-r|g-r|r-g|buckler"
  - id: a1_l4_ls
    act: 1
    when: { level: 4 }
    if: { movement: leap_slam }
    text: "Купіть сокиру/меч GR/GGR під Leap Slam і 2× Goat's Horn"
    regex: "b-b-|-b-b|b-.-b|b-b|nne|r-.-b|b-r-|g-b-r|g-r|r-g"
  - id: a1_dweller
    act: 1
    when: { area: "1_1_4_0" }
    points: 1
    text: "Flooded Depths: вбийте Dweller of the Deep (+1 очко, Tarkleigh)"
  - id: a1_l8
    act: 1
    when: { level: 8 }
    text: "Рів. 8: Rolling Magma + Ele Prolif + Added Lightning Damage"
  - id: a1_l8_ls
    act: 1
    when: { level: 8 }
    if: { movement: leap_slam }
    text: "Сила під Leap Slam: Heavy Belt або Amber Amulet (або сила на дереві)"
  - id: a1_brutus
    act: 1
    when: { area: "1_1_7_2" }
    text: "Upper Prison: вбийте Brutus"
  - id: a1_l10_sc
    act: 1
    when: { level: 10 }
    if: { movement: shield_charge }
    text: "Рів. 10: Shield Charge + Faster Attacks + Momentum; щит у дорозі, вейд на босах"
  - id: a1_l10_ls
    act: 1
    when: { level: 10 }
    if: { movement: leap_slam }
    text: "Рів. 10: Leap Slam + Faster Attacks + Momentum; свап Goat's Horns ↔ сокира + меч"
  - id: a1_flamedash
    act: 1
    when: { level: 10 }
    optional: true
    text: "(опц.) Frostblink → Flame Dash"
  - id: a1_mariner
    act: 1
    when: { area: "1_1_9" }
    points: 1
    text: "Ship Graveyard: вбийте Fairgraves (+1 очко, Bestel)"
  - id: a1_merveil
    act: 1
    when: { area: "1_1_11_2" }
    text: "Cavern of Anger: вбийте Merveil"

  # ---------- Act 2 ----------
  - id: a2_way_forward
    act: 2
    when: { area: "1_2_9" }
    points: 1
    text: "Western Forest: Thaumetic Seal, потім у A1 до Bestel (+1, The Way Forward); (опц.) Lightning Warp"
  - id: a2_l16
    act: 2
    when: { level: 16 }
    text: "Рів. 16: Herald of Thunder; (опц.) Herald of Ice/Skitterbots, Blood Rage, Arctic Armour"
    note: "Для Dex-гемів потрібен Jade Amulet або Dex на дереві."
  - id: a2_sacred
    act: 2
    when: { area: "1_2_5_1" }
    points: 1
    text: "Crypt: Golden Hand → Yeena (+1, Through Sacred Ground)"
  - id: a2_l18
    act: 2
    when: { level: 18 }
    text: "Рів. 18: Concentrated Effect або Cruelty безкоштовно, другий купіть; WoC, Desecrate, Ele Focus"
    note: "Покупки можна відкласти до Vaal Oversoul, коли буде достатньо Alteration."
  - id: a2_bandits
    act: 2
    text: "Bandits: допоможіть Alira"
  - id: a2_oversoul
    act: 2
    when: { area: "1_2_14_3" }
    text: "Ancient Pyramid: вбийте Vaal Oversoul"

  # ---------- Act 3 ----------
  - id: a3_victario
    act: 3
    when: { area: "1_3_10_1" }
    points: 1
    text: "Sewers: 3 бюсти (+1, Victario's Secrets)"
  - id: a3_l24
    act: 3
    when: { level: 24 }
    text: "Рів. 24: купіть Haste; (опц.) Anger на боси; (опц.) Anger/Flammability у Maramoa"
  - id: a3_l24_res
    act: 3
    when: { level: 24 }
    if: { act6_path: res_reduction }
    text: "Шлях Monster Res: Flammability замість Sniper's Mark, зніміть мастері Inversion"
  - id: a3_solaris
    act: 3
    when: { area: "1_3_8_2" }
    text: "Solaris Temple 2: крафт Fire Damage у кімнаті біля Lady Dialla"
  - id: a3_craft_sc
    act: 3
    when: { level: 24 }
    if: { movement: shield_charge }
    text: "Скрафтіть Flat Fire to Spells на вейди (4–8 Transmute)"
  - id: a3_craft_ls
    act: 3
    when: { level: 24 }
    if: { movement: leap_slam }
    text: "Скрафтіть Flat Fire to Spells на зброю Leap Slam (8 Transmute)"
  - id: a3_l28
    act: 3
    when: { level: 28 }
    text: "Рів. 28: купіть Cremation і Armageddon Brand; Armageddon Brand замість Rolling Magma"
  - id: a3_setup
    act: 3
    when: { level: 28 }
    text: "Сетап: AB + Ele Prolif + Added Lightning · Cremation + Conc Effect + Cruelty/Ele Focus"
    note: "Також: WoC + Flame Wall · Desecrate · Frostblink + Arcane Surge + Sniper's Mark/Flammability · SC/LS + Faster Attacks + Momentum · Haste/Anger · Blood Rage."
  - id: a3_piety
    act: 3
    when: { area: "1_3_14_2" }
    points: 1
    text: "Lunaris Temple 2: вбийте Piety (+1, Piety's Pets)"
  - id: a3_lab
    act: 3
    text: "Normal Labyrinth: перші очки асценду"
  - id: a3_dominus
    act: 3
    when: { area: "1_3_18_2" }
    text: "Upper Sceptre of God: вбийте Dominus"

  # ---------- Act 4 ----------
  - id: a4_indomitable
    act: 4
    when: { area: "1_4_3_2" }
    points: 1
    text: "Mines 2: звільніть Deshret (+1, An Indomitable Spirit)"
  - id: a4_kaom_level
    act: 4
    when: { area: "1_4_4_1" }
    done: { level: 32 }
    text: "Набийте 32 рівень до входу в Kaom's Stronghold"
  - id: a4_l38
    act: 4
    when: { level: 38 }
    text: "Рів. 38: Immolate у 4-лінк Armageddon Brand"
    note: "(опц.) голем у Oyun; Ignite Prolif замість Ele Prolif; CWDT + Immortal Call — по 1 Alchemy."
  - id: a4_malachai
    act: 4
    when: { area: "1_4_6_3" }
    text: "The Harvest: вбийте Malachai"

  # ---------- Act 5 ----------
  - id: a5_ruby
    act: 5
    when: { area: "1_5_town" }
    text: "Після The Key to Freedom: Ruby Flask"
  - id: a5_science
    act: 5
    when: { area: "1_5_2" }
    points: 1
    text: "Control Blocks: Miasmeter (+1, In Service to Science)"
  - id: a5_innocence
    act: 5
    when: { area: "1_5_5" }
    optional: true
    text: "(реком.) Chamber of Innocence: фарм гарантованих Magic пачок"
  - id: a5_torments
    act: 5
    when: { area: "1_5_7" }
    points: 1
    text: "Reliquary: 3 Kitava's Torments (+1); перед цим портал біля входу на Cathedral Rooftop"
  - id: a5_kitava
    act: 5
    when: { area: "1_5_8" }
    text: "Cathedral Rooftop: вбийте Kitava"

  # ---------- Act 6 ----------
  - id: a6_lily
    act: 6
    when: { area: "2_6_1" }
    text: "Twilight Strand: зачистіть, Lily Roth — перевірте вибір шляху в налаштуваннях"
  - id: a6_res
    act: 6
    if: { act6_path: res_reduction }
    text: "Шлях Monster Res: Added Lightning → Combustion, Ele Prolif → Ignite Prolif"
  - id: a6_setup
    act: 6
    text: "Сетап A6: AB + Ignite Prolif + Combustion + Immolate · Cremation + Conc + Ele Focus + Cruelty"
    note: "Також: SC/LS + Momentum + Faster Attacks · CWDT + Immortal Call · Frostblink + Arcane Surge + Flammability + WoC · Haste/Anger."
  - id: a6_father
    act: 6
    when: { area: "2_6_5" }
    points: 1
    text: "Karui Fortress: вбийте Tukohama (+1, The Father of War)"
  - id: a6_cloven
    act: 6
    when: { area: "2_6_8" }
    points: 1
    text: "Prisoner's Gate: вбийте Abberath (+1, The Cloven One)"
  - id: a6_puppet
    act: 6
    when: { area: "2_6_11" }
    points: 1
    text: "Wetlands: вбийте Ryslatha (+1, The Puppet Mistress)"
  - id: a6_pantheon
    act: 6
    when: { area: "2_6_15" }
    text: "Пантеон: major — Brine King, minor — Ryslatha; у Beacon портал для безпеки"

  # ---------- Act 7 ----------
  - id: a7_locket
    act: 7
    when: { area: "2_7_town" }
    text: "Після The Silver Locket: Granite або Jade Flask"
  - id: a7_master
    act: 7
    when: { area: "2_7_5_map" }
    points: 1
    text: "Maligaro's Sanctum: вбийте Maligaro (+1, The Master of a Million Faces)"
  - id: a7_queen
    act: 7
    when: { area: "2_7_7" }
    points: 1
    text: "Ashen Fields: вбийте Gruthkul (+1, Queen of Despair)"
  - id: a7_dread
    act: 7
    when: { area: "2_7_9" }
    optional: true
    text: "(опц.) Dread Thicket: T2 Fire крафт біля Dreadstone; портал біля входу для Greust"
    note: "Вейд: 2–4 Alchemy. Зброя Leap Slam: 2 Scouring + 4 Alchemy."
  - id: a7_kishara
    act: 7
    when: { area: "2_7_10" }
    points: 1
    text: "Causeway: Kishara's Star (+1)"
  - id: a7_arakaali
    act: 7
    when: { area: "2_7_12_2" }
    text: "Temple of Decay 2: вбийте Arakaali"

  # ---------- Act 8 ----------
  - id: a8_arctic
    act: 8
    when: { area: "2_8_1" }
    text: "Act 8: Arctic Armour у зонах з холодом"
  - id: a8_lab
    act: 8
    text: "Cruel Labyrinth, коли будуть усі тріали"
  - id: a8_love
    act: 8
    when: { area: "2_8_8" }
    points: 1
    text: "Quay: Ankh of Eternity → Clarissa (+1, Love is Dead)"
  - id: a8_gemling
    act: 8
    when: { area: "2_8_9" }
    points: 1
    text: "Grain Gate: Gemling Legion (+1)"
  - id: a8_yugul
    act: 8
    when: { area: "2_8_4" }
    points: 1
    text: "High Gardens: вбийте Yugul (+1, Reflection of Terror)"
  - id: a8_harbour
    act: 8
    when: { area: "2_8_13" }
    text: "Harbour Bridge: при поверненні Ctrl+клік по входу — новий інстанс заради досвіду"

  # ---------- Act 9 ----------
  - id: a9_aqueduct
    act: 9
    when: { area: "2_9_1" }
    optional: true
    text: "(опц.) Blood Aqueduct: можна фармити перед мапами"
  - id: a9_storm_blade
    act: 9
    when: { area: "2_9_3" }
    text: "Після The Storm Blade: рідкий Opal Sceptre"
  - id: a9_queen
    act: 9
    when: { area: "2_9_4" }
    points: 1
    text: "Oasis: вбийте Shakari (+1, Queen of the Sands)"
  - id: a9_ruler
    act: 9
    when: { area: "2_9_8" }
    points: 1
    text: "Quarry: вбийте Garukhan (+1, The Ruler of Highgate)"
  - id: a9_belly
    act: 9
    when: { area: "2_9_10_1" }
    optional: true
    text: "(опц.) Belly of the Beast: фласка від Bleed і Grace"

  # ---------- Act 10 ----------
  - id: a10_silver
    act: 10
    when: { area: "2_10_1" }
    text: "Після Safe Passage (Bannon): Silver Flask"
  - id: a10_ravaged
    act: 10
    when: { area: "2_10_2" }
    text: "Ravaged Square: портал біля входу, WP у місто, через портал на південь до Control Blocks"
  - id: a10_vilenta
    act: 10
    when: { area: "2_10_7" }
    points: 1
    text: "Control Blocks: вбийте Vilenta (+1, Vilenta's Vengeance)"
  - id: a10_rebirth
    act: 10
    when: { area: "2_10_4" }
    text: "Після Death and Rebirth: рідкий Widowsilk Robe або Blood Raiment"
  - id: a10_kitava
    act: 10
    when: { area: "2_10_6" }
    points: 1
    text: "Feeding Trough: вбийте Kitava (+1, An End to Hunger)"
  - id: a10_lab
    act: 10
    text: "Merciless Labyrinth"

tree:
  - id: ash_frost_storm
    name: "Ash, Frost and Storm — шлях до мастері Inversion"
  - id: inversion
    name: "Мастері Inversion (15% шанс інвертувати резисти монстрів)"
  - id: ls_strength
    name: "Сила під Leap Slam (якщо немає Heavy Belt / Amber Amulet)"
    when: { level: 8 }
    if: { movement: leap_slam }
    optional: true
  - id: dreamer
    name: "(опц.) Dreamer + мастері 12% Mana Reservation Efficiency"
    when: { level: 24 }
    optional: true
  - id: refund_inversion
    name: "Зняти мастері Inversion (шлях Monster Res)"
    when: { level: 24 }
    if: { act6_path: res_reduction }
    refund: true
  - id: explosive_impact
    name: "Explosive Impact (мастері Fire)"
    when: { points: 34 }
  - id: templar_aoe
    name: "Ноутаблі Templar на area / attack speed"
    when: { points: 43 }
  - id: elemental_overload
    name: "Elemental Overload"
    when: { points: 52 }
  - id: heart_and_soul
    name: "Practical Application, Heart and Soul, Fire Walker"
    when: { points: 61 }
  - id: purity_of_flesh
    name: "Purity of Flesh + мастері Skills Cost Life"
    when: { points: 63 }
  - id: sc_end
    name: "Deep Thoughts, Cruel Preparation, Heart of Flame, Righteous Army"
    if: { movement: shield_charge }
  - id: ls_end
    name: "Dark Arts, Coordination, Attack and Cast Speed"
    if: { movement: leap_slam }
  - id: surge_of_vigour
    name: "(опц.) Surge of Vigour + Regenerate 50 Life (під Blood Rage)"
    optional: true

splits:
  - id: mule
    label: Мул готовий
    on: { step: mule_stash }
    if: { mule: "yes" }
  - id: start_town
    label: Lioneye's Watch
    on: { step: a1_start }
  - id: lvl10
    label: Рівень 10
    on: { level: 10 }
  - id: act1
    label: Кінець Act 1
    on: { area: "1_2_town" }
  - id: act2
    label: Кінець Act 2
    on: { area: "1_3_town" }
  - id: lvl24
    label: Рівень 24
    on: { level: 24 }
  - id: lvl28
    label: Рівень 28
    on: { level: 28 }
  - id: act3
    label: Кінець Act 3
    on: { area: "1_4_town" }
  - id: act4
    label: Кінець Act 4
    on: { area: "1_5_town" }
  - id: act5
    label: Кінець Act 5
    on: { area: "2_6_town" }
  - id: act6
    label: Кінець Act 6
    on: { area: "2_7_town" }
  - id: act7
    label: Кінець Act 7
    on: { area: "2_8_1" }
  - id: act8
    label: Кінець Act 8
    on: { area: "2_9_1" }
  - id: act9
    label: Кінець Act 9
    on: { area: "2_10_town" }
  - id: finish
    label: Фініш (Karui Shores)
    on: { area: "2_11_endgame_town" }
