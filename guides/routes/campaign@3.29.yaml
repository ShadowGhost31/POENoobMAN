# Усе відмічається автоматично з Client.txt:
#   крок зони   when.area: X, done.area: Z — з'являється при вході в X, закривається при вході в Z;
#   квест       points: N — закривається рядком «You have received a Passive Skill Point»;
#   лабіринт    done.ascendancy: 2/4/6 — коли взято очки асценду після Normal/Cruel/Merciless Lab.
# Смерть босів гра в лог не пише, тому бос вважається вбитим при вході в зону, яку він відкриває
# (Merveil → The Southern Forest, Dominus → The Aqueduct, Kitava → Lioneye's Watch A6 тощо).
# Тексти — короткий власний опис кампанії; гайди білдів додають свої кроки через after:.

